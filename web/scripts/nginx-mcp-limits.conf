# http{}-level zones for the public Kelvin MCP (installed as /etc/nginx/conf.d/kelvin-mcp-limits.conf).
# Per client IP: 40 requests/minute sustained with a burst of 20, at most 6 concurrent, and a
# separate tighter zone for the unauthenticated discovery files. A rejected request is a 429.
limit_req_zone  $binary_remote_addr zone=kelvin_mcp:10m  rate=40r/m;
limit_conn_zone $binary_remote_addr zone=kelvin_mcp_conn:10m;
limit_req_status  429;
limit_conn_status 429;
