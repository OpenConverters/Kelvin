<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kelvin candidate picker</title>
    <style>
      :root {
        --fg: #1c1f24; --muted: #6b7280; --line: #d7dbe0; --card: rgba(0,0,0,.04);
        --accent: #c8102e; --pass: #1a7f4b; --warn: #a4680a; --fail: #b3261e;
        --chosen: rgba(200,16,46,.09);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e7e9ee; --muted: #9aa3b0; --line: #333a44; --card: rgba(255,255,255,.06);
          --accent: #ff6b81; --pass: #52c98a; --warn: #e0a83a; --fail: #ff7a70;
          --chosen: rgba(255,107,129,.12);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: transparent; color: var(--fg);
        font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #app { padding: 10px 12px 12px; }
      .pad { padding: 14px 2px; }
      h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
      .head { margin-bottom: 8px; }
      .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
      .err {
        background: rgba(255,93,85,.12); border-radius: 6px;
        padding: 8px 10px; font-size: 12.5px;
      }
      .muted { color: var(--muted); }
      .orig {
        display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
        background: var(--card); border-radius: 6px; padding: 6px 9px; margin-bottom: 9px;
      }
      .origlabel {
        font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
        color: var(--muted); font-weight: 650;
      }
      .ospec { font-size: 12px; color: var(--fg); opacity: .85; }
      .tbl { width: 100%; border-collapse: collapse; }
      .tbl th {
        text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px;
        border-bottom: 1px solid var(--line); padding: 5px 7px; white-space: nowrap;
      }
      .tbl td { padding: 6px 7px; border-bottom: 1px solid var(--line); vertical-align: top; }
      .row { cursor: pointer; }
      .row:hover { background: var(--card); }
      .row.chosen { background: var(--chosen); }
      .mpn { font-weight: 620; }
      .maker { color: var(--muted); font-size: 11.5px; }
      .status { font-weight: 620; font-size: 12px; }
      .status.recommended { color: var(--pass); }
      .status.partial { color: var(--warn); }
      .status.no_substitute { color: var(--fail); }
      .pen { color: var(--muted); font-size: 11px; }
      .act { text-align: right; white-space: nowrap; }
      .btn {
        font: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer;
        color: var(--fg); background: transparent;
        border: 1px solid var(--line); border-radius: 5px; padding: 3px 9px;
      }
      .btn:hover { border-color: var(--accent); color: var(--accent); }
      .btn.chosen { background: var(--accent); border-color: var(--accent); color: #fff; }
      .detailrow > .detail { background: var(--card); }
      .pills { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
      .pill {
        font-size: 11px; border-radius: 4px; padding: 1.5px 6px;
        border: 1px solid var(--line); color: var(--muted);
      }
      .pill.pass { color: var(--pass); border-color: var(--pass); }
      .pill.warn { color: var(--warn); border-color: var(--warn); }
      .pill.fail { color: var(--fail); border-color: var(--fail); }
      .notes { margin: 0 0 6px; padding-left: 16px; }
      .notes li { margin-bottom: 4px; }
      .margins { display: flex; flex-wrap: wrap; gap: 6px; }
      .margin { font-size: 11px; color: var(--muted); }
      .hint { color: var(--muted); font-size: 11.5px; margin-top: 8px; }
      .facets {
        display: flex; flex-direction: column; gap: 4px;
        background: var(--card); border-radius: 6px; padding: 6px 9px; margin-bottom: 9px;
      }
      .facet { display: flex; flex-wrap: wrap; gap: 5px; align-items: baseline; }
      /* NOT uppercased: these are the field names a caller types back into `filters`
         (dielectric_code, v_rated). Rendering them as DIELECTRIC_CODE would show the reader
         a spelling that is not the one the query takes. */
      .fname {
        font-size: 10.5px; letter-spacing: .04em; font-family: ui-monospace, SFMono-Regular,
        Menlo, monospace; color: var(--muted); font-weight: 650; min-width: 132px;
      }
      .fchip {
        font-size: 11px; border-radius: 4px; padding: 1px 6px;
        border: 1px solid var(--line); color: var(--fg);
      }
      /* "not stated" is an absence, not a value — it must not look like a pickable option. */
      .fchip.unstated { color: var(--muted); border-style: dashed; }
      .fchip.more, .fchip.muted { color: var(--muted); border-color: transparent; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/picker.js"></script>
  </body>
</html>
